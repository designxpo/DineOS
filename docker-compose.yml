# Mezvaan on one server (rented, India region). Scale `api` horizontally once there are several
# hundred outlets; Redis carries live events between API instances.
#
#   cp .env.production.example .env.production   # fill in secrets and domains
#   docker compose --env-file .env.production up -d --build
#   docker compose --env-file .env.production run --rm api node apps/api/dist/create-admin.js --email you@company.in --name You --password '...'

# Containers run without extra Linux privileges: no capabilities beyond what each one needs, and
# no gaining privileges later (setuid binaries). Memory and CPU are capped so one runaway service
# cannot starve the rest; raise the limits for a bigger server.
x-hardened: &hardened
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # The entrypoint needs its root capabilities to set up the data directory, then drops to the
    # postgres user itself.
    security_opt: ['no-new-privileges:true']
    environment:
      POSTGRES_USER: dineos_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      # A server set up before the rename keeps its database: set POSTGRES_DB=dineos there.
      POSTGRES_DB: ${POSTGRES_DB:-mezmitra}
      MEZMITRA_APP_PASSWORD: ${MEZMITRA_APP_PASSWORD:-${DINEOS_APP_PASSWORD:-}}
      MEZMITRA_ADMIN_PASSWORD: ${MEZMITRA_ADMIN_PASSWORD:-${DINEOS_ADMIN_PASSWORD:-}}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dineos_owner -d $${POSTGRES_DB:-mezmitra}']
      interval: 5s
      retries: 20

  # Carries live events between API servers and rate-limit counters. Password-protected even on
  # the private network; keeps nothing on disk.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    <<: *hardened
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD (openssl rand -hex 32)}
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 128mb --maxmemory-policy volatile-lru']
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    <<: *hardened
    command: ['node', 'apps/api/dist/migrate.js']
    environment:
      DATABASE_OWNER_URL: postgres://dineos_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mezmitra}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    <<: *hardened
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 2048M }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://dineos_app:${MEZMITRA_APP_PASSWORD:-${DINEOS_APP_PASSWORD:-}}@postgres:5432/${POSTGRES_DB:-mezmitra}
      DATABASE_ADMIN_URL: postgres://dineos_admin:${MEZMITRA_ADMIN_PASSWORD:-${DINEOS_ADMIN_PASSWORD:-}}@postgres:5432/${POSTGRES_DB:-mezmitra}
      TOKEN_SECRET: ${TOKEN_SECRET:?}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      CORS_ORIGINS: https://${APP_DOMAIN}
      GUEST_URL_TEMPLATE: https://${APP_DOMAIN}/t/{token}
      PUBLIC_API_URL: https://${API_DOMAIN}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_DIR: /app/apps/api/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    volumes:
      - uploads:/app/apps/api/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    <<: *hardened
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1024M }
    depends_on: [api]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *hardened
    # The only capability it keeps: listening on ports 80 and 443.
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
    ports: ['80:80', '443:443']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?}
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  # One-shot: run nightly from the host's cron, e.g.
  #   30 2 * * * cd /opt/mezmitra && docker compose --env-file .env.production run --rm backup
  backup:
    build: { context: ., dockerfile: infra/docker/backup.Dockerfile }
    profiles: ['ops']
    <<: *hardened
    environment:
      DATABASE_OWNER_URL: postgres://dineos_owner:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mezmitra}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?}
      BACKUP_RSYNC_TARGET: ${BACKUP_RSYNC_TARGET:-}
      BACKUP_S3_URI: ${BACKUP_S3_URI:-}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_KEY:-}
      AWS_ENDPOINT_URL: ${BACKUP_S3_ENDPOINT:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:

# Optional self-hosted object storage for menu photos (STORAGE_DRIVER=s3), on top of the main file:
#   docker compose -f docker-compose.yml -f docker-compose.s3.yml --env-file .env.production up -d
# Kept apart so its credentials are required only when it runs; it never starts with defaults.
# Make the bucket readable for photos only (see docs/operations.md, "Object storage").
services:
  minio:
    # Pin this to the MinIO release you test before going live.
    image: minio/minio:latest
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY (openssl rand -hex 32)}
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 1024M }
    volumes:
      - miniodata:/data

volumes:
  miniodata:
